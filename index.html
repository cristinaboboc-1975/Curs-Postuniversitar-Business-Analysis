    // --- AUTENTIFICARE ---
    function login(email, pass) {
      const u = db.users.find(x => x.email.toLowerCase() === email.trim().toLowerCase() && x.pass === pass.trim());

        currentUser = u;
        sessionStorage.setItem('ba_lms_user', JSON.stringify(currentUser));
        render();
      } else {
        alert('Email sau parolă incorectă!');
      }

    function logout() {

      render();

    // --- ÎNCĂRCARE FILE PDF DE CĂTRE ADMIN ---
    function handlePdfUpload(courseId, fileInput) {
      const file = fileInput.files[0];
      if (!file) return;

      if (file.type !== "application/pdf") {
        alert("Vă rugăm să selectați un fișier în format PDF!");
        return;
      }

      const reader = new FileReader();
      reader.onload = function(e) {
        const course = db.courses.find(c => c.id === courseId);
        if (course) {
          course.pdfData = e.target.result; // Salvare ca Data URL (Base64)
          saveData();
          alert("Fișierul PDF a fost încărcat și securizat cu succes!");
        }
      };
      reader.readAsDataURL(file);
    }

    function setPdfUrl(courseId, url) {
      const course = db.courses.find(c => c.id === courseId);
      if (course) {
        course.pdfData = url;
        saveData();

              <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition flex flex-col justify-between">
                <div>
                  <div class="flex justify-between items-center mb-2">
                    <span class="text-xs font-bold bg-indigo-100 text-indigo-700 px-2.5 py-0.5 rounded-full">${course.day}</span>
                    <span class="text-xs text-slate-500 font-medium">${course.date}</span>
                  </div>
                  <h3 class="font-bold text-slate-800 text-base mb-1">${course.title}</h3>
                  <p class="text-xs font-medium text-indigo-600 mb-2"><i class="fa-solid fa-user-tie mr-1"></i> ${course.lecturer}</p>
                  <p class="text-slate-600 text-xs mb-4 line-clamp-2">${course.description}</p>
                </div>

                <div class="space-y-2 border-t pt-3 border-slate-100">
                  <button onclick="selectedCourse = db.courses.find(c => c.id === ${course.id}); currentSlideIndex = 0; render();" class="w-full bg-slate-900 text-white py-2 rounded-lg text-xs font-medium hover:bg-indigo-600 transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-eye text-xs"></i> Deschide Suport Curs
                  </button>

                  ${currentUser.role === 'admin' ? `
                    <div class="bg-slate-50 p-2 rounded border border-slate-200 text-xs space-y-1.5">
                      <span class="font-bold text-slate-700 block">Încărcare Suport (PDF / PPT)</span>
                      <input type="file" accept=".pdf" onchange="handlePdfUpload(${course.id}, this)" class="block w-full text-xs text-slate-500 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
                    </div>
                  ` : ''}
                </div>
              </div>
            `).join('')}
          </div>
        `;
      }

      if (activeTab === 'assignments') {
        return `
          <h2 class="text-xl font-bold mb-4 text-slate-800">Predare Teme & Proiecte</h2>
          <div class="space-y-4">
            ${db.assignments.map(ass => {
              const mySub = ass.submitted.find(s => s.userId === currentUser.id);
              return `
                <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                  <div class="flex justify-between items-start mb-2">
                    <h3 class="font-bold text-slate-800">${ass.title}</h3>
                    <span class="text-xs font-semibold px-2.5 py-1 rounded ${mySub ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-700'}">
                      ${mySub ? 'Predat' : 'În așteptare'}
                    </span>
                  </div>
                  <p class="text-xs text-slate-500 mb-4">Termen limită: ${ass.dueDate}</p>
                  ${mySub ? `
                    <div class="bg-slate-50 p-3 rounded-lg border text-xs text-slate-700">
                      <p class="font-semibold text-slate-500 mb-1">Răspunsul tău trimis la data de ${mySub.date}:</p>
                      <p class="whitespace-pre-line">${mySub.text}</p>
                    </div>
                  ` : `
                    <form onsubmit="event.preventDefault(); submitAssignment(${ass.id}, this.text.value);">
                      <textarea name="text" required placeholder="Scrie rezolvarea temei sau lipeste linkul către fișier..." class="w-full border rounded-lg p-3 text-sm mb-3 focus:ring-2 focus:ring-indigo-500 outline-none" rows="3"></textarea>
                      <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-xs font-medium hover:bg-indigo-700 transition">
                        Trimite Tema
                      </button>
                    </form>
                  `}
                </div>
              `;
            }).join('')}
          </div>
        `;
      }

      if (activeTab === 'qa') {
        return `
          <h2 class="text-xl font-bold mb-4 text-slate-800">Întrebări și Discuții</h2>
          <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm mb-6">
            <h3 class="font-semibold text-sm mb-3">Adresează o întrebare lectorilor</h3>
            <form onsubmit="event.preventDefault(); addQuestion(this.title.value, this.text.value); this.reset();">
              <input name="title" required placeholder="Titlu întrebare / Subiect..." class="w-full border rounded-lg p-2.5 text-sm mb-2 focus:ring-2 focus:ring-indigo-500 outline-none">
              <textarea name="text" required placeholder="Detaliază întrebarea ta..." class="w-full border rounded-lg p-2.5 text-sm mb-3 focus:ring-2 focus:ring-indigo-500 outline-none" rows="2"></textarea>
              <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-xs font-medium hover:bg-indigo-700 transition">
                Postează Întrebarea
              </button>
            </form>
          </div>
          <div class="space-y-4">
            ${db.questions.map(q => `
              <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                <div class="flex items-center gap-2 mb-1">
                  <span class="font-bold text-slate-800 text-sm">${q.title}</span>
                  <span class="text-xs text-slate-400">• de ${q.author}</span>
                </div>
                <p class="text-slate-600 text-sm mb-3">${q.text}</p>
                <div class="pl-4 border-l-2 border-indigo-200 space-y-2">
                  ${q.replies.map(r => `
                    <div class="bg-slate-50 p-2.5 rounded text-xs text-slate-700">
                      ${r}
                    </div>
                  `).join('')}
                </div>
              </div>
            `).join('')}
          </div>
        `;
      }

      if (activeTab === 'admin' && currentUser.role === 'admin') {
        return `
          <h2 class="text-xl font-bold mb-4 text-slate-800">Administrare Conturi Utilizatori</h2>
          <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="p-4 bg-slate-900 text-white flex justify-between items-center">
              <span class="font-bold text-sm">Total Utilizatori: ${db.users.length}</span>
              <span class="text-xs text-slate-400">Lectori + 29 Cursanți</span>
            </div>
            <div class="overflow-x-auto">
              <table class="w-full text-xs text-left border-collapse">
                <thead class="bg-slate-100 text-slate-700 font-semibold border-b">
                  <tr>
                    <th class="p-3">#</th>
                    <th class="p-3">Nume complet</th>
                    <th class="p-3">Email</th>
                    <th class="p-3">Parolă</th>
                    <th class="p-3">Rol</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  ${db.users.map((u, i) => `
                    <tr class="hover:bg-slate-50">
                      <td class="p-3 font-mono text-slate-400">${i+1}</td>
                      <td class="p-3 font-medium text-slate-800">${u.name}</td>
                      <td class="p-3 text-slate-600">${u.email}</td>
                      <td class="p-3 font-mono text-indigo-600 font-bold">${u.pass}</td>
                      <td class="p-3">
                        <span class="px-2 py-0.5 rounded text-[10px] font-bold uppercase ${u.role === 'admin' ? 'bg-purple-100 text-purple-700' : 'bg-blue-100 text-blue-700'}">
                          ${u.role}
                        </span>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }
    }

    function submitAssignment(assId, text) {
      const ass = db.assignments.find(a => a.id === assId);
      if (ass) {
        ass.submitted.push({ userId: currentUser.id, userName: currentUser.name, text: text, date: new Date().toLocaleDateString('ro-RO') });
        saveData();
        alert('Tema a fost trimisă cu succes!');
      }
    }

    function addQuestion(title, text) {
      db.questions.unshift({
        id: Date.now(),
        author: currentUser.name,
        title: title,
        text: text,
        replies: []
      });
      saveData();
    }

    render();
  </script>
</body>
</html>
