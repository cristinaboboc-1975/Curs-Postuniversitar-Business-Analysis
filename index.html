<body class="bg-slate-50 font-sans text-slate-800 no-select min-h-screen flex flex-col">

  <div id="app" class="flex-1 flex flex-col"></div>

  <script>
    // --- CONEXIUNE SUPABASE CLOUD ---
    const SUPABASE_URL = "https://yzclneykrdzvozczuzqb.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_gXgziqWU09av4tGzIlX8Wg_2d3e6X1l";

    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = JSON.parse(sessionStorage.getItem('ba_lms_user')) || null;
    let activeTab = 'courses';
    let selectedCourse = null;
    let selectedCourseFilter = 1;
    let activeQuizCourse = null;
    let activeQuizQuestions = [];
    let quizUserAnswers = {};
    let quizResultSummary = null;
    let showPasswordModal = false;

    let coursesList = [];
    let submissionsList = [];
    let quizResultsList = [];
    let questionsList = [];
    let studentsList = [];

    // --- VERIFICARE DREPTURI PE FIECARE ZI/MODUL ---
    function canManageCourse(user, courseId) {
      if (!user) return false;
      if (user.role === 'superadmin') return true;
      if (user.role !== 'admin') return false;

      const email = user.email.toLowerCase();
      if (courseId === 1 && email === 'smaranda.cimpoeru@csie.ase.ro') return true;
      if (courseId === 2 && email === 'erika.marin@csie.ase.ro') return true;
      if (courseId === 3 && email === 'mihaela.mihai@csie.ase.ro') return true;
      if (courseId === 4 && email === 'mihaela.covrig@csie.ase.ro') return true;
      if ((courseId === 6 || courseId === 7 || courseId === 8 || courseId === 9) && 
          (email === 'cristina.boboc@csie.ase.ro' || email === 'camelia.dan@lseg.com')) return true;

      return false;
    }

    // --- PARSER PENTRU FORMATUL AIKEN (MOODLE) ---
    function parseAikenQuiz(text) {
      const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
      const questions = [];
      let currentQ = null;

      lines.forEach(line => {
        if (line.startsWith('ANSWER:')) {
          if (currentQ) {
            currentQ.answer = line.replace('ANSWER:', '').trim();
            questions.push(currentQ);
            currentQ = null;
          }
        } else if (/^[A-E]\.\s/.test(line)) {
          if (currentQ) {
            const letter = line[0];
            const optionText = line.substring(2).trim();
            currentQ.options.push({ letter, text: optionText });
          }
        } else {
          if (!currentQ) {
            currentQ = { question: line, options: [], answer: '' };
          } else {
            currentQ.question += ' ' + line;
          }
        }
      });
      return questions;
    }

    // --- ÎNCĂRCARE DATE DIN SUPABASE ---
    async function loadCloudData() {
      try {
        const { data: cData } = await sb.from('courses').select('*').order('id');
        if (cData) coursesList = cData;

        const { data: sData } = await sb.from('submissions').select('*');
        if (sData) submissionsList = sData;

        const { data: qrData } = await sb.from('quiz_results').select('*');
        if (qrData) quizResultsList = qrData;

        const { data: qData } = await sb.from('questions').select('*').order('id', { ascending: false });
        if (qData) questionsList = qData;

        const { data: uData } = await sb.from('users').select('*').eq('role', 'student').order('name');
        if (uData) studentsList = uData;

        render();
      } catch (err) {
        console.error("Eroare încărcare date Supabase:", err);
      }
    }

    // --- LOGICĂ AUTENTIFICARE ---
    async function login(email, pass) {
      const cleanEmail = email.trim().toLowerCase();
      const cleanPass = pass.trim();

      try {
        const { data, error } = await sb
          .from('users')
          .select('*')
          .eq('email', cleanEmail)
          .eq('pass', cleanPass);

        if (error) {
          alert("Eroare Supabase RLS / Permisiuni: " + error.message);
          console.error(error);
          return;
        }

        if (data && data.length > 0) {
          currentUser = data[0];
          sessionStorage.setItem('ba_lms_user', JSON.stringify(currentUser));
          loadCloudData();
        } else {
          alert("Date incorecte! Nu s-a găsit niciun cont cu emailul '" + cleanEmail + "' și parola introdusă.");
        }
      } catch (err) {
        alert("Eroare de conexiune la Supabase: " + err.message);
      }
    }

    function logout() {
      currentUser = null;
      sessionStorage.removeItem('ba_lms_user');
      selectedCourse = null;
      activeQuizCourse = null;
      showPasswordModal = false;
      render();
    }

    // --- SCHIMBARE PAROLĂ UTILIZATOR ---
    async function changePassword(newPass, confirmPass) {
      if (!newPass || newPass.trim().length < 4) {
        alert("Parola trebuie să aibă cel puțin 4 caractere!");
        return;
      }
      if (newPass.trim() !== confirmPass.trim()) {
        alert("Parolele introduse nu coincid!");
        return;
      }

      try {
        const { error } = await sb
          .from('users')
          .update({ pass: newPass.trim() })
          .eq('id', currentUser.id);

        if (error) {
          alert("Eroare la actualizarea parolei în baza de date: " + error.message);
          return;
        }

        currentUser.pass = newPass.trim();
        sessionStorage.setItem('ba_lms_user', JSON.stringify(currentUser));
        showPasswordModal = false;
        alert("Parola ta a fost schimbată cu succes!");
        render();
      } catch (err) {
        alert("Eroare de rețea: " + err.message);
      }
    }

    // --- ÎNCĂRCARE SUPORT CURS (PDF - PROTEJAT) ---
    async function uploadCoursePdf(courseId, file) {
      if (!file) return;
      const fileName = `curs_${courseId}_${Date.now()}_${file.name.replace(/\s+/g, '_')}`;

      const { data, error } = await sb.storage.from('materiale-curs').upload(fileName, file);
      if (error) {
        alert("Eroare la încărcare în Storage (materiale-curs): " + error.message);
        return;
      }

      const { data: publicUrlData } = sb.storage.from('materiale-curs').getPublicUrl(fileName);
      const pdfUrl = publicUrlData.publicUrl;

      const { error: dbErr } = await sb.from('courses').update({ pdf_url: pdfUrl }).eq('id', courseId);
      if (dbErr) {
        alert("Eroare actualizare tabel cursuri: " + dbErr.message);
        return;
      }

      alert("Suportul de curs a fost salvat cu succes în Cloud!");
      loadCloudData();
    }

    // --- ÎNCĂRCARE MATERIALE DIDACTICE DESCĂRCABILE (MULTI-FIȘIER) ---
    async function uploadDownloadableResources(courseId, filesList) {
      if (!filesList || filesList.length === 0) return;

      const course = coursesList.find(c => c.id === courseId);
      if (!course) return;

      let currentResources = Array.isArray(course.downloadable_resources) ? [...course.downloadable_resources] : [];
      let successCount = 0;

      for (let file of filesList) {
        const fileName = `resource_${courseId}_${Date.now()}_${file.name.replace(/\s+/g, '_')}`;
        const { data, error } = await sb.storage.from('materiale-didactice').upload(fileName, file);

        if (error) {
          alert(`Eroare la încărcarea fișierului ${file.name}: ` + error.message);
          continue;
        }

        const { data: publicUrlData } = sb.storage.from('materiale-didactice').getPublicUrl(fileName);
        currentResources.push({
          name: file.name,
          url: publicUrlData.publicUrl
        });
        successCount++;
      }

      const { error: dbErr } = await sb.from('courses').update({ downloadable_resources: currentResources }).eq('id', courseId);
      if (dbErr) {
        alert("Eroare salvare resurse în baza de date: " + dbErr.message);
        return;
      }

      alert(`${successCount} material(e) didactic(e) încărcat(e) cu succes!`);
      loadCloudData();
    }

    // --- ȘTERGERE MATERIAL DIDACTIC DESCĂRCABIL ---
    async function deleteDownloadableResource(courseId, index) {
      if (!confirm("Sigur doriți să ștergeți acest material didactic?")) return;

      const course = coursesList.find(c => c.id === courseId);
      if (!course) return;

      let currentResources = Array.isArray(course.downloadable_resources) ? [...course.downloadable_resources] : [];
      currentResources.splice(index, 1);

      const { error: dbErr } = await sb.from('courses').update({ downloadable_resources: currentResources }).eq('id', courseId);
      if (dbErr) {
        alert("Eroare la ștergerea fișierului: " + dbErr.message);
        return;
      }

      loadCloudData();
    }

    // --- ÎNCĂRCARE QUIZ MOODLE (FIȘIER AIKEN TXT) ---
    async function uploadCourseQuiz(courseId, file) {
      if (!file) return;
      const fileName = `quiz_${courseId}_${Date.now()}_${file.name.replace(/\s+/g, '_')}`;

      const { data, error } = await sb.storage.from('quizuri-moodle').upload(fileName, file);
      if (error) {
        alert("Eroare la încărcare în Storage (quizuri-moodle): " + error.message);
        return;
      }

      const { data: publicUrlData } = sb.storage.from('quizuri-moodle').getPublicUrl(fileName);
      const quizUrl = publicUrlData.publicUrl;

      const { error: dbErr } = await sb.from('courses').update({ quiz_url: quizUrl }).eq('id', courseId);
      if (dbErr) {
        alert("Eroare actualizare tabel cursuri (quiz_url): " + dbErr.message);
        return;
      }

      alert("Quiz-ul Moodle a fost încărcat cu succes! Cursanții pot susține testul interactiv.");
      loadCloudData();
    }

    // --- ÎNCĂRCARE ENUNȚ TEMĂ (PROFESOR) ---
    async function uploadCourseAssignment(courseId, file) {
      if (!file) return;
      const fileName = `enunt_tema_${courseId}_${Date.now()}_${file.name.replace(/\s+/g, '_')}`;

      const { data, error } = await sb.storage.from('teme-profesori').upload(fileName, file);
      if (error) {
        alert("Eroare la încărcare în Storage (teme-profesori): " + error.message);
        return;
      }

      const { data: publicUrlData } = sb.storage.from('teme-profesori').getPublicUrl(fileName);
      const assignmentUrl = publicUrlData.publicUrl;

      const { error: dbErr } = await sb.from('courses').update({ assignment_url: assignmentUrl }).eq('id', courseId);
      if (dbErr) {
        alert("Eroare actualizare tabel cursuri (assignment_url): " + dbErr.message);
        return;
      }

      alert("Enunțul temei a fost încărcat cu succes!");
      loadCloudData();
    }

    // --- LANSATE / SUSTINERE QUIZ MOODLE INTERACTIV ---
    async function startQuiz(course) {
      if (!course.quiz_url) return;
      try {
        const resp = await fetch(course.quiz_url);
        const text = await resp.text();
        const parsed = parseAikenQuiz(text);

        if (!parsed || parsed.length === 0) {
          alert("Fișierul Quiz Moodle nu a putut fi extras corect. Verificați formatul Aiken.");
          return;
        }

        activeQuizCourse = course;
        activeQuizQuestions = parsed;
        quizUserAnswers = {};
        quizResultSummary = null;
        render();
      } catch (err) {
        alert("Eroare la descărcarea testului: " + err.message);
      }
    }

    // --- TRIMITERE & CORECTARE AUTOMATĂ QUIZ MOODLE ---
    async function submitQuiz() {
      if (!activeQuizCourse || !activeQuizQuestions.length) return;

      let correctCount = 0;
      const totalCount = activeQuizQuestions.length;

      activeQuizQuestions.forEach((q, idx) => {
        if (quizUserAnswers[idx] === q.answer) {
          correctCount++;
        }
      });

      const grade10 = parseFloat(((correctCount / totalCount) * 10).toFixed(2));
      const takenAt = new Date().toLocaleString('ro-RO');

      const existing = quizResultsList.find(r => r.course_id === activeQuizCourse.id && r.user_id === currentUser.id);

      if (existing) {
        await sb.from('quiz_results').update({
          score: correctCount,
          total_questions: totalCount,
          grade_10: grade10,
          taken_at: takenAt
        }).eq('id', existing.id);
      } else {
        await sb.from('quiz_results').insert({
          course_id: activeQuizCourse.id,
          user_id: currentUser.id,
          user_name: currentUser.name,
          user_email: currentUser.email,
          score: correctCount,
          total_questions: totalCount,
          grade_10: grade10,
          taken_at: takenAt
        });
      }

      quizResultSummary = {
        correct: correctCount,
        total: totalCount,
        grade: grade10
      };

      alert(`Test finalizat! Scorul tău: ${correctCount}/${totalCount} (Nota ${grade10}). Rezultatul s-a salvat în catalog!`);
      loadCloudData();
    }

    // --- PREDARE TEMĂ (CURSANT) ---
    async function uploadSubmission(courseId, file, notesText) {
      if (!file) {
        alert("Vă rugăm să alegeți un fișier!");
        return;
      }

      const fileName = `tema_${courseId}_${currentUser.id}_${Date.now()}_${file.name.replace(/\s+/g, '_')}`;
      const { data, error } = await sb.storage.from('teme-studenti').upload(fileName, file);

      if (error) {
        alert("Eroare la încărcarea fișierului: " + error.message);
        return;
      }

      const { data: publicUrlData } = sb.storage.from('teme-studenti').getPublicUrl(fileName);
      const fileUrl = publicUrlData.publicUrl;

      const existing = submissionsList.find(s => s.course_id === courseId && s.user_id === currentUser.id);

      if (existing) {
        await sb.from('submissions').update({
          file_name: file.name,
          file_url: fileUrl,
          notes: notesText || '',
          submitted_at: new Date().toLocaleString('ro-RO')
        }).eq('id', existing.id);
      } else {
        await sb.from('submissions').insert({
          course_id: courseId,
          user_id: currentUser.id,
          user_name: currentUser.name,
          user_email: currentUser.email,
          file_name: file.name,
          file_url: fileUrl,
          notes: notesText || '',
          submitted_at: new Date().toLocaleString('ro-RO')
        });
      }

      alert("Tema ta a fost încărcată cu succes în Cloud!");
      loadCloudData();
    }

    // --- ACORDARE NOTĂ TEMĂ & FEEDBACK (LECTOR) ---
    async function saveGrade(subId, gradeVal, feedbackVal) {
      const { error } = await sb.from('submissions').update({
        grade: gradeVal,
        feedback: feedbackVal,
        graded_by: currentUser.name
      }).eq('id', subId);

      if (error) {
        alert("Eroare salvare notă temă: " + error.message);
        return;
      }

      alert("Nota și feedback-ul pentru temă au fost salvate cu succes!");
      loadCloudData();
    }

    // --- ADĂUGARE ÎNTREBARE Q&A ---
    async function addQuestion(title, text) {
      const { error } = await sb.from('questions').insert({
        author: currentUser.name,
        title: title,
        text: text,
        replies: []
      });

      if (error) {
        alert("Eroare adăugare întrebare: " + error.message);
        return;
      }

      loadCloudData();
    }

    // --- RĂSPUNS LA ÎNTREBARE Q&A ---
    async function replyQuestion(qId, replyText) {
      if (!replyText.trim()) return;
      const q = questionsList.find(x => x.id === qId);
      if (!q) return;

      const updatedReplies = [...(q.replies || []), `${currentUser.name}: ${replyText.trim()}`];

      const { error } = await sb.from('questions').update({
        replies: updatedReplies
      }).eq('id', qId);

      if (error) {
        alert("Eroare salvare răspuns: " + error.message);
        return;
      }

      loadCloudData();
    }

    // --- PROTECȚII ANTI-DESCĂRCARE & IMPRIMARE ---
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
      if ((e.ctrlKey || e.metaKey) && (e.key === 'p' || e.key === 's' || e.key === 'c' || e.key === 'u')) {
        e.preventDefault();
        alert('Protecție activă: Salvarea, copierea sau imprimarea suportului de curs este restricționată.');
      }
    });

    // --- RANDARE INTERFAȚĂ APLICAȚIE ---
    function render() {
      const app = document.getElementById('app');

      if (!currentUser) {
        app.innerHTML = `
          <div class="min-h-screen flex items-center justify-center bg-slate-100 p-4">
            <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md border border-slate-200">
              <div class="text-center mb-6">
                <div class="bg-indigo-600 text-white w-14 h-14 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl font-bold shadow">
                  <i class="fa-solid fa-chart-line"></i>
                </div>
                <h1 class="text-2xl font-bold text-slate-900">Business Analysis</h1>
                <p class="text-slate-500 text-xs mt-1 uppercase tracking-wider font-semibold">Curs Postuniversitar ASE</p>
              </div>
              <form onsubmit="event.preventDefault(); login(this.email.value, this.pass.value);">
                <div class="mb-4">
                  <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Adresă Email</label>
                  <input name="email" type="email" required placeholder="nume@domain.ro" class="w-full px-3 py-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div class="mb-6">
                  <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Parolă</label>
                  <input name="pass" type="password" required placeholder="••••••••" class="w-full px-3 py-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white py-2.5 rounded-lg font-medium hover:bg-indigo-700 transition shadow">Intră în Platformă</button>
              </form>
            </div>

        `;
        return;
      }

      const isSuperAdmin = currentUser.role === 'superadmin';
      const isAdminOrSuper = currentUser.role === 'admin' || currentUser.role === 'superadmin';

      app.innerHTML = `

          <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">

              <button onclick="showPasswordModal = true; render()" class="bg-indigo-700 hover:bg-indigo-600 px-3 py-1.5 rounded-md text-xs font-medium border border-indigo-600 transition flex items-center gap-1.5">
                <i class="fa-solid fa-key"></i> Schimbă Parola
              </button>
              <button onclick="logout()" class="bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-md text-xs font-medium border border-slate-700 transition">
                Ieșire <i class="fa-solid fa-right-from-bracket ml-1"></i>
              </button>
            </div>
          </div>
        </header>

        ${showPasswordModal ? `
          <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
            <div class="bg-white rounded-xl shadow-2xl border border-slate-200 w-full max-w-md p-6">
              <div class="flex justify-between items-center mb-4 border-b pb-3">
                <h3 class="font-bold text-slate-800 text-lg flex items-center gap-2">
                  <i class="fa-solid fa-key text-indigo-600"></i> Schimbare Parolă
                </h3>
                <button onclick="showPasswordModal = false; render()" class="text-slate-400 hover:text-slate-600">
                  <i class="fa-solid fa-xmark text-lg"></i>
                </button>
              </div>
              <form onsubmit="event.preventDefault(); changePassword(this.newPass.value, this.confirmPass.value);">
                <div class="mb-4">
                  <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Noua Parolă</label>
                  <input name="newPass" type="password" required placeholder="••••••••" class="w-full px-3 py-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div class="mb-6">
                  <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Confirmă Noua Parolă</label>
                  <input name="confirmPass" type="password" required placeholder="••••••••" class="w-full px-3 py-2.5 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div class="flex gap-2">
                  <button type="button" onclick="showPasswordModal = false; render()" class="w-1/2 bg-slate-100 hover:bg-slate-200 text-slate-700 py-2.5 rounded-lg text-xs font-semibold transition">Anulează</button>

            </div>

        <div class="bg-white border-b border-slate-200 shadow-sm">
          <div class="max-w-6xl mx-auto px-4 flex gap-6 text-sm font-medium overflow-x-auto">
            <button onclick="activeTab='courses'; selectedCourse=null; activeQuizCourse=null; render()" class="py-3 border-b-2 whitespace-nowrap ${activeTab === 'courses' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-500 hover:text-slate-800'}">
              <i class="fa-solid fa-book-open mr-1"></i> Orar & Suport Curs
            </button>
            <button onclick="activeTab='assignments'; activeQuizCourse=null; render()" class="py-3 border-b-2 whitespace-nowrap ${activeTab === 'assignments' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-500 hover:text-slate-800'}">

            </button>
            ${isAdminOrSuper ? `
              <button onclick="activeTab='gradebook'; activeQuizCourse=null; render()" class="py-3 border-b-2 whitespace-nowrap ${activeTab === 'gradebook' ? 'border-indigo-600 text-indigo-600' : 'border-transparent text-slate-500 hover:text-slate-800'}">
                <i class="fa-solid fa-table-list mr-1"></i> Catalog Note General
              </button>

          </div>
        </div>

        <main class="max-w-6xl mx-auto px-4 py-6 flex-1 w-full">
          ${renderTabContent()}
        </main>
      `;
    }

    function renderTabContent() {
      const isSuperAdmin = currentUser.role === 'superadmin';
      const isAdminOrSuper = currentUser.role === 'admin' || currentUser.role === 'superadmin';

      // MODAL SUSTINERE QUIZ MOODLE INTERACTIV
      if (activeQuizCourse && activeQuizQuestions.length > 0) {
        return `
          <div class="max-w-3xl mx-auto bg-white p-6 rounded-xl shadow-lg border border-slate-200">
            <div class="flex justify-between items-center border-b pb-4 mb-4">
              <div>
                <span class="text-xs bg-purple-100 text-purple-700 font-bold px-2.5 py-0.5 rounded-full">${activeQuizCourse.day}</span>
                <h2 class="text-xl font-bold text-slate-900 mt-1">Test Interactiv Moodle: ${activeQuizCourse.title}</h2>
                <p class="text-xs text-slate-500">Titular: ${activeQuizCourse.lecturer}</p>
              </div>
              <button onclick="activeQuizCourse=null; render()" class="text-slate-400 hover:text-slate-700 font-bold text-lg">
                <i class="fa-solid fa-xmark"></i>
              </button>
            </div>

            ${quizResultSummary ? `
              <div class="bg-purple-50 p-6 rounded-xl border border-purple-200 text-center mb-6">
                <i class="fa-solid fa-award text-4xl text-purple-600 mb-2"></i>
                <h3 class="text-2xl font-bold text-purple-900">Testul a fost corectat!</h3>
                <p class="text-lg font-semibold text-purple-800 mt-1">Scor: ${quizResultSummary.correct} din ${quizResultSummary.total} răspunsuri corecte</p>
                <div class="inline-block bg-purple-600 text-white font-mono text-xl font-bold px-6 py-2 rounded-lg mt-3 shadow">
                  Nota Obținută: ${quizResultSummary.grade} / 10
                </div>
                <p class="text-xs text-slate-500 mt-3">Nota s-a salvat automat în catalogul general de note!</p>
              </div>
            ` : ''}

            <div class="space-y-6">
              ${activeQuizQuestions.map((q, qIdx) => {
                const userAns = quizUserAnswers[qIdx];
                const isCorrect = quizResultSummary && userAns === q.answer;

                return `
                  <div class="p-4 rounded-lg border ${quizResultSummary ? (isCorrect ? 'bg-green-50/60 border-green-300' : 'bg-red-50/60 border-red-300') : 'bg-slate-50 border-slate-200'}">
                    <p class="font-bold text-slate-900 text-sm mb-3">
                      <span class="bg-slate-200 text-slate-800 px-2 py-0.5 rounded text-xs mr-2">Întrebarea ${qIdx + 1}</span>
                      ${q.question}
                    </p>

                    <div class="space-y-2">
                      ${q.options.map(opt => {
                        const isSelected = userAns === opt.letter;
                        const isRightAnswer = quizResultSummary && opt.letter === q.answer;

                        let optionStyle = "border-slate-200 bg-white hover:border-indigo-300";
                        if (quizResultSummary) {
                          if (isRightAnswer) optionStyle = "border-green-500 bg-green-100 text-green-900 font-bold";
                          else if (isSelected && !isRightAnswer) optionStyle = "border-red-500 bg-red-100 text-red-900 line-through";
                        } else if (isSelected) {
                          optionStyle = "border-indigo-600 bg-indigo-50 text-indigo-900 font-semibold";
                        }

                        return `
                          <label onclick="${!quizResultSummary ? `quizUserAnswers[${qIdx}]='${opt.letter}'; render();` : ''}" class="flex items-start gap-3 p-3 rounded-lg border cursor-pointer transition ${optionStyle}">
                            <input type="radio" name="q_${qIdx}" value="${opt.letter}" ${isSelected ? 'checked' : ''} ${quizResultSummary ? 'disabled' : ''} class="mt-0.5 text-indigo-600 focus:ring-indigo-500">
                            <span class="text-xs leading-relaxed"><strong class="mr-1">${opt.letter}.</strong> ${opt.text}</span>
                          </label>
                        `;
                      }).join('')}
                    </div>

                    ${quizResultSummary ? `
                      <div class="mt-2 text-xs font-semibold ${isCorrect ? 'text-green-700' : 'text-red-700'}">
                        ${isCorrect ? '<i class="fa-solid fa-circle-check mr-1"></i> Răspuns Corect!' : `<i class="fa-solid fa-circle-xmark mr-1"></i> Răspuns incorect. Varianta corectă era: <strong>${q.answer}</strong>`}
                      </div>
                    ` : ''}
                  </div>
                `;
              }).join('')}
            </div>

            <div class="mt-6 border-t pt-4 flex justify-between items-center">
              <button onclick="activeQuizCourse=null; render()" class="px-4 py-2 border rounded-lg text-xs font-semibold text-slate-600 hover:bg-slate-100">
                Închide Testul
              </button>
              ${!quizResultSummary ? `
                <button onclick="submitQuiz()" class="px-6 py-2.5 bg-purple-600 hover:bg-purple-700 text-white rounded-lg text-xs font-bold transition shadow flex items-center gap-2">
                  <i class="fa-solid fa-paper-plane"></i> Trimite și Corectează Testul Automat
                </button>
              ` : `
                <button onclick="startQuiz(activeQuizCourse)" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-xs font-bold hover:bg-indigo-700 transition">
                  <i class="fa-solid fa-rotate-right mr-1"></i> Re-susține Testul
                </button>
              `}
            </div>
          </div>
        `;
      }

      // TAB 1: ORAR & VIZUALIZARE CURSURI PROTEJATE
      if (activeTab === 'courses') {
        if (selectedCourse) {
          const today = new Date().toLocaleDateString('ro-RO');
          return `
            <div>
              <button onclick="selectedCourse=null; render()" class="mb-4 text-indigo-600 hover:underline text-sm font-medium flex items-center gap-1">
                <i class="fa-solid fa-arrow-left"></i> Înapoi la lista de cursuri
              </button>

              <div class="bg-white rounded-xl shadow-lg border border-slate-200 overflow-hidden mb-6">
                <div class="bg-slate-900 text-white p-4 flex justify-between items-center">
                  <div>
                    <span class="text-xs bg-indigo-600 text-white font-semibold px-2 py-0.5 rounded">${selectedCourse.day}</span>
                    <h2 class="font-bold text-lg mt-1">${selectedCourse.title}</h2>
                    <p class="text-xs text-slate-400"><i class="fa-solid fa-user-tie mr-1"></i> Lector: ${selectedCourse.lecturer}</p>
                  </div>
                  <span class="text-xs text-slate-300 font-mono">${selectedCourse.date}</span>
                </div>

                ${selectedCourse.pdf_url ? `
                  <div class="relative bg-slate-800 p-2 min-h-[600px]">
                    <div class="absolute inset-0 pointer-events-none z-20 flex items-center justify-center opacity-15 transform -rotate-12 font-mono text-center text-white text-xl font-bold">
                      ${currentUser.name}<br>${currentUser.email}<br>${today}<br>CONFIDENȚIAL • PROTEJAT
                    </div>
                    <iframe src="${selectedCourse.pdf_url}#toolbar=0&navpanes=0" class="w-full h-[650px] border-0 rounded"></iframe>
                  </div>
                ` : `
                  <div class="p-12 text-center text-slate-500">
                    <i class="fa-solid fa-file-pdf text-4xl mb-3 text-slate-300"></i>
                    <p class="font-semibold text-slate-700">Suportul de curs (prezentarea) urmează să fie încărcat de titular.</p>
                  </div>
                `}
              </div>
            </div>
          `;
        }

        return `
          <div class="flex justify-between items-center mb-6">
            <div>
              <h2 class="text-xl font-bold text-slate-800">Program Curs & Materiale Cloud</h2>
              <p class="text-xs text-slate-500">Curs Postuniversitar Business Analysis</p>
            </div>
          </div>

          <div class="grid gap-4 sm:grid-cols-2">
            ${coursesList.map(course => {
              const canEditThisCourse = canManageCourse(currentUser, course.id);
              const resources = Array.isArray(course.downloadable_resources) ? course.downloadable_resources : [];
              const myQuizResult = quizResultsList.find(r => r.course_id === course.id && r.user_id === currentUser.id);

              return `
                <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition flex flex-col justify-between">
                  <div>
                    <div class="flex justify-between items-center mb-2">
                      <span class="text-xs font-bold bg-indigo-100 text-indigo-700 px-2.5 py-0.5 rounded-full">${course.day}</span>
                      <span class="text-xs text-slate-500 font-medium">${course.date}</span>
                    </div>
                    <h3 class="font-bold text-slate-800 text-base mb-1">${course.title}</h3>
                    <p class="text-xs font-medium text-indigo-600 mb-2"><i class="fa-solid fa-user-tie mr-1"></i> ${course.lecturer}</p>
                    <p class="text-slate-600 text-xs mb-3 line-clamp-2">${course.description}</p>

                    <!-- SECTIUNE MATERIALE ADITIONALE (QUIZ, ENUNT TEMA, RESURSE DATASETS) -->
                    <div class="space-y-2 mb-4">
                      <div class="flex flex-wrap gap-2">
                        ${course.quiz_url ? `
                          <button onclick="startQuiz(coursesList.find(c => c.id === ${course.id}))" class="bg-purple-50 text-purple-700 hover:bg-purple-100 border border-purple-200 px-2.5 py-1 rounded text-xs font-semibold flex items-center gap-1 transition">
                            <i class="fa-solid fa-puzzle-piece text-purple-600"></i> ${myQuizResult ? `Test Moodle (Nota ${myQuizResult.grade_10})` : 'Susține Test Moodle'}
                          </button>
                        ` : ''}

                        ${course.assignment_url ? `
                          <a href="${course.assignment_url}" target="_blank" class="bg-emerald-50 text-emerald-700 hover:bg-emerald-100 border border-emerald-200 px-2.5 py-1 rounded text-xs font-semibold flex items-center gap-1 transition">
                            <i class="fa-solid fa-file-lines text-emerald-600"></i> Enunț Temă
                          </a>
                        ` : ''}
                      </div>

                      <!-- LISTĂ MATERIALE DIDACTICE DESCĂRCABILE -->
                      ${resources.length > 0 ? `
                        <div class="bg-sky-50/70 p-2.5 rounded-lg border border-sky-200 text-xs">
                          <span class="font-bold text-sky-900 block mb-1.5"><i class="fa-solid fa-folder-open text-sky-600 mr-1"></i> Materiale Didactice & Date Descărcabile:</span>
                          <div class="space-y-1">
                            ${resources.map((res, idx) => `
                              <div class="flex items-center justify-between bg-white p-1.5 rounded border border-sky-100">
                                <a href="${res.url}" target="_blank" download="${res.name}" class="text-indigo-600 font-semibold hover:underline truncate max-w-[220px] flex items-center gap-1">
                                  <i class="fa-solid fa-file-arrow-down text-sky-600"></i> ${res.name}
                                </a>
                                ${canEditThisCourse ? `
                                  <button onclick="deleteDownloadableResource(${course.id}, ${idx})" class="text-red-500 hover:text-red-700 ml-2" title="Șterge fișier">
                                    <i class="fa-solid fa-trash-can"></i>
                                  </button>
                                ` : ''}
                              </div>
                            `).join('')}
                          </div>
                        </div>
                      ` : ''}
                    </div>
                  </div>

                  <div class="space-y-2 border-t pt-3 border-slate-100">
                    <button onclick="selectedCourse = coursesList.find(c => c.id === ${course.id}); render();" class="w-full bg-slate-900 text-white py-2 rounded-lg text-xs font-medium hover:bg-indigo-600 transition flex items-center justify-center gap-2">
                      <i class="fa-solid fa-eye text-xs"></i> Vizualizează Suport Curs Securizat (Nedescărcabil)
                    </button>

                    ${canEditThisCourse ? `
                      <div class="bg-indigo-50/70 p-3 rounded-lg border border-indigo-200 text-xs space-y-2.5 mt-2">
                        <span class="font-bold text-indigo-900 block border-b border-indigo-200 pb-1">
                          <i class="fa-solid fa-sliders text-indigo-600 mr-1"></i> Administrare Modul (${course.day}):
                        </span>
                        
                        <div>
                          <label class="block text-[11px] font-semibold text-slate-700 mb-0.5"><i class="fa-solid fa-file-pdf text-red-500 mr-1"></i> Suport Curs Protejat (PDF):</label>
                          <input type="file" accept=".pdf" onchange="uploadCoursePdf(${course.id}, this.files[0])" class="block w-full text-xs text-slate-500 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-700">
                        </div>

                        <div>
                          <label class="block text-[11px] font-semibold text-slate-700 mb-0.5"><i class="fa-solid fa-file-circle-plus text-sky-600 mr-1"></i> Materiale Didactice Descărcabile (Multi-fișier):</label>
                          <input type="file" multiple onchange="uploadDownloadableResources(${course.id}, this.files)" class="block w-full text-xs text-slate-500 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-sky-600 file:text-white hover:file:bg-sky-700">
                        </div>

                        <div>
                          <label class="block text-[11px] font-semibold text-slate-700 mb-0.5"><i class="fa-solid fa-puzzle-piece text-purple-600 mr-1"></i> Quiz Moodle Interactiv (Fișier TXT format Aiken):</label>
                          <input type="file" accept=".txt" onchange="uploadCourseQuiz(${course.id}, this.files[0])" class="block w-full text-xs text-slate-500 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-purple-600 file:text-white hover:file:bg-purple-700">
                        </div>

                        <div>
                          <label class="block text-[11px] font-semibold text-slate-700 mb-0.5"><i class="fa-solid fa-file-signature text-emerald-600 mr-1"></i> Enunț Temă (Fișier):</label>
                          <input type="file" onchange="uploadCourseAssignment(${course.id}, this.files[0])" class="block w-full text-xs text-slate-500 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-emerald-600 file:text-white hover:file:bg-emerald-700">
                        </div>
                      </div>
                    ` : ''}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      }

      // TAB 2: PREDARE TEME (CURSANT) SAU CORECTARE (LECTORI)
      if (activeTab === 'assignments') {
        if (currentUser.role === 'student') {
          return `
            <h2 class="text-xl font-bold mb-1 text-slate-800">Predare Teme (Cloud Storage)</h2>
            <p class="text-xs text-slate-500 mb-6">Puteți încărca orice tip de fișier (Excel, Word, PPT, R script, Python, PDF, ZIP) pentru fiecare modul.</p>

            <div class="space-y-6">
              ${coursesList.map(course => {
                const sub = submissionsList.find(s => s.course_id === course.id && s.user_id === currentUser.id);
                return `
                  <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                    <div class="flex justify-between items-start mb-3">
                      <div>
                        <span class="text-xs font-bold bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded">${course.day}</span>
                        <h3 class="font-bold text-slate-800 text-base mt-1">${course.title}</h3>
                        <p class="text-xs text-slate-500"><i class="fa-solid fa-user-tie mr-1"></i> Lector: ${course.lecturer}</p>
                      </div>
                      <div>
                        ${sub ? (sub.grade ? `<span class="bg-green-100 text-green-800 text-xs font-bold px-3 py-1 rounded-full border border-green-300"><i class="fa-solid fa-star text-amber-500 mr-1"></i> Nota Temă: ${sub.grade}</span>` : `<span class="bg-amber-100 text-amber-800 text-xs font-bold px-3 py-1 rounded-full border border-amber-300">Temă Predată (În așteptare)</span>`) : `<span class="bg-slate-100 text-slate-600 text-xs font-bold px-3 py-1 rounded-full border border-slate-200">Temă Nepredată</span>`}
                      </div>
                    </div>

                    ${course.assignment_url ? `
                      <div class="mb-3 bg-emerald-50/60 p-2.5 rounded-lg border border-emerald-200 flex items-center justify-between text-xs">
                        <span class="font-semibold text-emerald-900"><i class="fa-solid fa-circle-info mr-1 text-emerald-600"></i> Cerință / Enunț temă de la lector:</span>
                        <a href="${course.assignment_url}" target="_blank" class="bg-emerald-600 hover:bg-emerald-700 text-white px-2.5 py-1 rounded font-medium flex items-center gap-1 transition">
                          <i class="fa-solid fa-download"></i> Descarcă Enunț
                        </a>
                      </div>
                    ` : ''}

                    ${sub ? `
                      <div class="bg-slate-50 p-3 rounded text-xs space-y-1 mb-3 border">
                        <p><strong>Fișier predat:</strong> <a href="${sub.file_url}" target="_blank" class="text-indigo-600 font-bold hover:underline inline-flex items-center gap-1"><i class="fa-solid fa-download"></i> ${sub.file_name}</a></p>
                        <p class="text-slate-500">Predat la: ${sub.submitted_at}</p>
                        ${sub.notes ? `<p class="text-slate-700 italic">" ${sub.notes} "</p>` : ''}
                        ${sub.grade ? `
                          <div class="bg-emerald-50 p-2.5 rounded border border-emerald-200 text-xs mt-2">
                            <p class="font-bold text-emerald-900">Nota Temă: ${sub.grade} (corectat de ${sub.graded_by || 'Lector'})</p>
                            ${sub.feedback ? `<p class="text-emerald-800 mt-0.5"><strong>Feedback:</strong> ${sub.feedback}</p>` : ''}
                          </div>
                        ` : ''}
                      </div>
                    ` : ''}

                    <form onsubmit="event.preventDefault(); uploadSubmission(${course.id}, this.fileInput.files[0], this.notesInput.value);" class="bg-slate-50 p-3 rounded-lg border border-dashed border-slate-300 text-xs space-y-2">
                      <span class="font-bold text-slate-700 block">${sub ? 'Re-încarcă un alt fișier / actualizează tema:' : 'Selectează fișierul temei:'}</span>
                      <input name="fileInput" type="file" required class="block w-full text-slate-500 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-700">
                      <input name="notesInput" type="text" placeholder="Observații opționale pentru lector..." class="w-full border rounded p-2 focus:ring-1 focus:ring-indigo-500 outline-none">
                      <button type="submit" class="bg-slate-900 hover:bg-indigo-600 text-white px-4 py-1.5 rounded text-xs font-semibold transition">
                        <i class="fa-solid fa-cloud-arrow-up mr-1"></i> ${sub ? 'Actualizează Tema' : 'Trimite Tema în Cloud'}
                      </button>
                    </form>
                  </div>
                `;
              }).join('')}
            </div>
          `;
        } else {
          return `
            <div class="flex justify-between items-center mb-4">
              <div>
                <h2 class="text-xl font-bold text-slate-800">Corectare Teme & Note (Cloud)</h2>
                <p class="text-xs text-slate-500">Selectați modulul de curs pentru a vedea temele încărcate de cursanți.</p>
              </div>
            </div>

            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm mb-6 flex items-center gap-4">
              <label class="text-xs font-bold text-slate-700 uppercase">Selectează Cursul:</label>
              <select onchange="selectedCourseFilter = parseInt(this.value); render();" class="border rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none flex-1 max-w-md">
                ${coursesList.map(c => `<option value="${c.id}" ${selectedCourseFilter === c.id ? 'selected' : ''}>${c.day}: ${c.title} (${c.lecturer})</option>`).join('')}
              </select>
            </div>

            <div class="space-y-4">
              ${(() => {
                const subs = submissionsList.filter(s => s.course_id === selectedCourseFilter);
                if (subs.length === 0) return `<div class="bg-white p-8 rounded-xl border text-center text-slate-500"><i class="fa-solid fa-inbox text-3xl mb-2 text-slate-300"></i><p>Nicio temă predată încă pentru acest modul.</p></div>`;

                return subs.map(sub => `
                  <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                    <div class="flex justify-between items-start mb-2">
                      <div>
                        <h3 class="font-bold text-slate-800 text-base">${sub.user_name}</h3>
                        <p class="text-xs text-slate-500">${sub.user_email} • Predat la: ${sub.submitted_at}</p>
                      </div>
                      <a href="${sub.file_url}" target="_blank" class="bg-indigo-50 text-indigo-700 hover:bg-indigo-100 border border-indigo-200 px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5 transition">
                        <i class="fa-solid fa-download"></i> Descarcă: ${sub.file_name}
                      </a>
                    </div>
                    ${sub.notes ? `<p class="text-xs text-slate-600 bg-slate-50 p-2 rounded mb-3 italic">Observație student: "${sub.notes}"</p>` : ''}

                    <form onsubmit="event.preventDefault(); saveGrade(${sub.id}, this.grade.value, this.feedback.value);" class="bg-slate-50 p-3 rounded-lg border border-slate-200 text-xs space-y-3">
                      <div class="grid grid-cols-1 sm:grid-cols-4 gap-3">
                        <div>
                          <label class="block font-bold text-slate-700 mb-1">Nota Temă:</label>
                          <input name="grade" type="text" value="${sub.grade || ''}" required placeholder="ex: 10" class="w-full border rounded p-2 text-sm outline-none focus:ring-1 focus:ring-indigo-500">
                        </div>
                        <div class="sm:col-span-3">
                          <label class="block font-bold text-slate-700 mb-1">Feedback Lector / Asistent:</label>
                          <input name="feedback" type="text" value="${sub.feedback || ''}" placeholder="Feedback pentru temă..." class="w-full border rounded p-2 text-sm outline-none focus:ring-1 focus:ring-indigo-500">
                        </div>
                      </div>
                      <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded font-semibold text-xs transition">
                        <i class="fa-solid fa-floppy-disk mr-1"></i> Salvează Nota Temă
                      </button>
                    </form>
                  </div>
                `).join('');
              })()}
            </div>
          `;
        }
      }

      // TAB 3: ÎNTREBĂRI & DISCUȚII (Q&A)
      if (activeTab === 'qa') {
        return `
          <h2 class="text-xl font-bold mb-4 text-slate-800">Întrebări și Discuții</h2>
          <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm mb-6">
            <h3 class="font-semibold text-sm mb-3">Adresează o întrebare nouă</h3>
            <form onsubmit="event.preventDefault(); addQuestion(this.title.value, this.text.value); this.reset();">
              <input name="title" required placeholder="Titlu întrebare / Subiect..." class="w-full border rounded-lg p-2.5 text-sm mb-2 outline-none focus:ring-2 focus:ring-indigo-500">
              <textarea name="text" required placeholder="Detaliază întrebarea ta..." class="w-full border rounded-lg p-2.5 text-sm mb-3 outline-none focus:ring-2 focus:ring-indigo-500" rows="2"></textarea>
              <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-xs font-medium hover:bg-indigo-700 transition">Postează Întrebarea</button>
            </form>
          </div>
          <div class="space-y-4">
            ${questionsList.map(q => `
              <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                <div class="flex items-center gap-2 mb-1">
                  <span class="font-bold text-slate-800 text-sm">${q.title}</span>
                  <span class="text-xs text-slate-400">• de ${q.author}</span>
                </div>
                <p class="text-slate-600 text-sm mb-3">${q.text}</p>
                <div class="pl-4 border-l-2 border-indigo-200 space-y-2 mb-3">
                  ${(q.replies || []).map(r => `<div class="bg-slate-50 p-2.5 rounded text-xs text-slate-700">${r}</div>`).join('')}
                </div>
                <form onsubmit="event.preventDefault(); replyQuestion(${q.id}, this.replyText.value); this.reset();" class="flex gap-2">
                  <input name="replyText" required placeholder="Răspunde la întrebare..." class="flex-1 border rounded-lg px-3 py-1.5 text-xs outline-none focus:ring-1 focus:ring-indigo-500">
                  <button type="submit" class="bg-slate-900 text-white px-3 py-1.5 rounded-lg text-xs font-medium hover:bg-indigo-600 transition">Răspunde</button>
                </form>
              </div>
            `).join('')}
          </div>
        `;
      }

      // TAB 4: CATALOG GENERAL NOTE (ADMIN ONLY) — AFIȘEAZĂ DOUĂ NOTE (QUIZ & TEMĂ)
      if (activeTab === 'gradebook' && isAdminOrSuper) {
        return `
          <div class="flex justify-between items-center mb-4">
            <div>
              <h2 class="text-xl font-bold text-slate-800">Catalog General Note Cursanți (Live Cloud)</h2>
              <p class="text-xs text-slate-500">Sunt afișate două note pentru fiecare modul: <strong class="text-purple-700">Q (Nota Quiz Moodle - auto-corectată)</strong> și <strong class="text-emerald-700">T (Nota Temă - corectată de lector)</strong>.</p>
            </div>
          </div>

          <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
              <table class="w-full text-xs text-left border-collapse">
                <thead class="bg-slate-900 text-white font-semibold">
                  <tr>
                    <th class="p-3 border-r border-slate-700">#</th>
                    <th class="p-3 border-r border-slate-700 min-w-[180px]">Cursant</th>
                    ${coursesList.map(c => `<th class="p-2 border-r border-slate-700 text-center min-w-[100px]">${c.day}</th>`).join('')}
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  ${studentsList.map((st, i) => `
                    <tr class="hover:bg-slate-50">
                      <td class="p-3 font-mono text-slate-400 border-r">${i+1}</td>
                      <td class="p-3 font-bold text-slate-800 border-r">${st.name}</td>
                      ${coursesList.map(c => {
                        const sub = submissionsList.find(s => s.course_id === c.id && s.user_id === st.id);
                        const qRes = quizResultsList.find(q => q.course_id === c.id && q.user_id === st.id);

                        return `
                          <td class="p-2 border-r text-center font-mono">
                            <div class="space-y-1">
                              <div>
                                ${qRes ? `
                                  <span class="bg-purple-100 text-purple-800 font-bold px-1.5 py-0.5 rounded text-[10px]" title="Test Moodle de la ${qRes.taken_at}">
                                    Q: ${qRes.grade_10}
                                  </span>
                                ` : `<span class="text-slate-300 text-[10px]">Q: -</span>`}
                              </div>
                              <div>
                                ${sub && sub.grade ? `
                                  <span class="bg-emerald-100 text-emerald-800 font-bold px-1.5 py-0.5 rounded text-[10px]" title="Temă corectată de ${sub.graded_by}">
                                    T: ${sub.grade}
                                  </span>
                                ` : (sub ? `<span class="text-amber-600 font-bold text-[10px]">T: Predat</span>` : `<span class="text-slate-300 text-[10px]">T: -</span>`)}
                              </div>
                            </div>
                          </td>
                        `;
                      }).join('')}
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }
    }

    if (currentUser) {
      loadCloudData();
    } else {
      render();
    }
  </script>
</body>
</html>
