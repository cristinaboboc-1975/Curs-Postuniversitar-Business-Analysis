    // --- INTEGRARE GITHUB API PENTRU REPOZITORIU PRIVAT ---
    async function uploadToPrivateGitHub(courseId, file) {
      if (!ghConfig.token) {
        alert("Vă rugăm să setați mai întâi Token-ul GitHub în tab-ul 'Setări GitHub'!");
        return;
      }

      const reader = new FileReader();
      reader.onload = async function(e) {
        const base64Content = e.target.result.split(',')[1];
        const filePath = `curs_${courseId}_${file.name.replace(/\s+/g, '_')}`;
        const url = `https://api.github.com/repos/${ghConfig.owner}/${ghConfig.repo}/contents/${filePath}`;

        try {
          // Verificare dacă există fișierul deja
          let sha = null;
          const checkRes = await fetch(url, { headers: { "Authorization": `Bearer ${ghConfig.token}` } });
          if (checkRes.ok) {
            const fileData = await checkRes.json();
            sha = fileData.sha;
          }

          // Incarcare pe repo privat
          const res = await fetch(url, {
            method: "PUT",
            headers: {
              "Authorization": `Bearer ${ghConfig.token}`,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              message: `Incarcare suport curs ${courseId}`,
              content: base64Content,
              ...(sha ? { sha: sha } : {})
            })
          });

          if (res.ok) {
            const course = db.courses.find(c => c.id === courseId);
            if (course) {
              course.pdfPath = filePath;
              course.pdfData = e.target.result; // Salvare locală fallback
              saveData();
              alert(`Suportul de curs a fost încărcat cu succes în repozitoriul privat GitHub (${filePath})!`);
            }
          } else {
            const err = await res.json();
            alert("Eroare la încărcare pe GitHub: " + err.message);
          }
        } catch (err) {
          alert("Eroare de conexiune la API GitHub.");
        }
      };
      reader.readAsDataURL(file);
    }

              <div class="mb-4">
                <label class="block text-xs font-bold uppercase text-slate-700 mb-1">Nume Repozitoriu Privat</label>
                <input name="repo" type="text" required value="${ghConfig.repo}" class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
              </div>
              <div class="mb-6">
                <label class="block text-xs font-bold uppercase text-slate-700 mb-1">GitHub Personal Access Token (PAT)</label>
                <input name="token" type="password" required value="${ghConfig.token}" placeholder="github_pat_..." class="w-full border rounded-lg p-2.5 text-sm font-mono focus:ring-2 focus:ring-indigo-500 outline-none">
                <p class="text-[11px] text-slate-400 mt-1">Token-ul este salvat în siguranță în browserul dvs.</p>
              </div>
              <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-lg text-xs font-bold transition">
                <i class="fa-solid fa-floppy-disk mr-1"></i> Salvează Configurația
              </button>
            </form>
          </div>
        `;
      }

      // TAB 2: PREDARE TEME (CURSANT) SAU CORECTARE TEME (PROFESORI / ASISTENT)
      if (activeTab === 'assignments') {
        const isAdminOrSuper = currentUser.role === 'admin' || currentUser.role === 'superadmin';
        if (!isAdminOrSuper) {
          return `
            <h2 class="text-xl font-bold mb-1 text-slate-800">Predare Teme Curs</h2>
            <p class="text-xs text-slate-500 mb-6">Puteți încărca orice tip de fișier pentru fiecare modul.</p>
            <div class="space-y-6">
              ${db.courses.map(course => {
                const sub = db.submissions.find(s => s.courseId === course.id && s.userId === currentUser.id);
                return `
                  <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                    <div class="flex justify-between items-start mb-3">
                      <div>
                        <span class="text-xs font-bold bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded">${course.day}</span>
                        <h3 class="font-bold text-slate-800 text-base mt-1">${course.title}</h3>
                      </div>
                      <div>
                        ${sub ? (sub.grade ? `<span class="bg-green-100 text-green-800 text-xs font-bold px-3 py-1 rounded-full border border-green-300">Notat: ${sub.grade}</span>` : `<span class="bg-amber-100 text-amber-800 text-xs font-bold px-3 py-1 rounded-full border border-amber-300">Predat</span>`) : `<span class="bg-slate-100 text-slate-600 text-xs font-bold px-3 py-1 rounded-full border border-slate-200">Nepredat</span>`}
                      </div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          `;
        } else {
          return `
            <h2 class="text-xl font-bold text-slate-800 mb-4">Corectare Teme & Notare Cursanți</h2>
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm mb-6 flex items-center gap-4">
              <label class="text-xs font-bold text-slate-700 uppercase">Selectează Cursul:</label>
              <select onchange="selectedCourseFilter = parseInt(this.value); render();" class="border rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none flex-1 max-w-md">
                ${db.courses.map(c => `<option value="${c.id}" ${selectedCourseFilter === c.id ? 'selected' : ''}>${c.day}: ${c.title}</option>`).join('')}
              </select>
            </div>
          `;
        }
      }

      if (activeTab === 'qa') {
        return `<h2 class="text-xl font-bold mb-4 text-slate-800">Întrebări și Discuții</h2>`;
      }

      if (activeTab === 'gradebook') {
        return `<h2 class="text-xl font-bold mb-4 text-slate-800">Catalog Note General</h2>`;
      }
    }

    render();
  </script>
</body>
</html>
