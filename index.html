    // --- LOGICĂ AUTENTIFICARE ---
    function login(email, pass) {
      const u = db.users.find(x => x.email.toLowerCase() === email.trim().toLowerCase() && x.pass === pass.trim());

        currentUser = u;
        sessionStorage.setItem('ba_lms_user', JSON.stringify(currentUser));
        render();
      } else {
        alert('Email sau parolă incorectă!');
      }

    function logout() {
      currentUser = null;

      selectedCourse = null;
      render();
    }

    // --- ÎNCĂRCARE TEMĂ DE CĂTRE CURSANT (ORICE FIȘIER) ---
    function uploadStudentSubmission(courseId, fileInput, notesText) {
      const file = fileInput.files[0];
      if (!file) {
        alert("Vă rugăm să selectați un fișier de încărcat!");
        return;
      }

      if (file.size > 15 * 1024 * 1024) {
        alert("Dimensiunea fișierului depășește limita recomandată de 15 MB!");
        return;
      }

      const reader = new FileReader();
      reader.onload = function(e) {
        let sub = db.submissions.find(s => s.courseId === courseId && s.userId === currentUser.id);
        if (!sub) {
          sub = {
            id: Date.now(),
            courseId: courseId,
            userId: currentUser.id,
            userName: currentUser.name,
            userEmail: currentUser.email
          };
          db.submissions.push(sub);
        }

        sub.fileName = file.name;
        sub.fileType = file.type || "application/octet-stream";
        sub.fileData = e.target.result; // Base64
        sub.notes = notesText || "";
        sub.submittedAt = new Date().toLocaleString('ro-RO');
        sub.grade = sub.grade || null;
        sub.feedback = sub.feedback || null;

        saveData();
        alert(`Tema pentru cursul selectat a fost încărcată cu succes!`);
      };
      reader.readAsDataURL(file);
    }

    // --- ACORDARE NOTĂ & FEEDBACK DE CĂTRE PROFESOR ---
    function saveGradeAndFeedback(subId, gradeVal, feedbackVal) {
      const sub = db.submissions.find(s => s.id === subId);
      if (sub) {
        sub.grade = gradeVal;
        sub.feedback = feedbackVal;
        sub.gradedBy = currentUser.name;
        sub.gradedAt = new Date().toLocaleString('ro-RO');
        saveData();
        alert("Nota și feedback-ul au fost salvate cu succes!");
      }
    }

    // --- ÎNCĂRCARE PDF SUPORT CURS DE CĂTRE ADMIN ---
    function handlePdfUpload(courseId, fileInput) {
      const file = fileInput.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const course = db.courses.find(c => c.id === courseId);
        if (course) {
          course.pdfData = e.target.result;
          saveData();
          alert("Suportul de curs a fost încărcat cu succes!");
        }
      };
      reader.readAsDataURL(file);
    }

                    </div>

                    ${sub ? `
                      <div class="bg-slate-50 p-4 rounded-lg border border-slate-200 text-xs space-y-2 mb-3">
                        <div class="flex justify-between items-center border-b pb-2">
                          <span class="font-semibold text-slate-700">Fișier încărcat:</span>
                          <a href="${sub.fileData}" download="${sub.fileName}" class="text-indigo-600 font-bold hover:underline flex items-center gap-1">
                            <i class="fa-solid fa-download"></i> ${sub.fileName}
                          </a>
                        </div>
                        <p class="text-slate-500">Data predării: ${sub.submittedAt}</p>
                        ${sub.notes ? `<p class="text-slate-700 italic">" ${sub.notes} "</p>` : ''}

                        ${sub.grade ? `
                          <div class="bg-emerald-50 p-3 rounded border border-emerald-200 text-xs mt-2">
                            <p class="font-bold text-emerald-900">Notă: ${sub.grade} (corectat de ${sub.gradedBy || 'Profesor'})</p>
                            ${sub.feedback ? `<p class="text-emerald-800 mt-1"><strong>Feedback:</strong> ${sub.feedback}</p>` : ''}
                          </div>
                        ` : ''}
                      </div>
                    ` : ''}

                    <!-- Formular Incarcare/Reincarcare -->
                    <form onsubmit="event.preventDefault(); uploadStudentSubmission(${course.id}, this.fileInput, this.notesInput.value);" class="bg-slate-50/50 p-3 rounded-lg border border-dashed border-slate-300 text-xs space-y-2">
                      <span class="font-bold text-slate-700 block">${sub ? 'Re-încarcă alt fișier / actualizează tema:' : 'Incarcă tema pentru acest modul:'}</span>
                      <input name="fileInput" type="file" required class="block w-full text-slate-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-700">
                      <input name="notesInput" type="text" placeholder="Observații opționale pentru profesor..." class="w-full border rounded p-2 focus:ring-1 focus:ring-indigo-500 outline-none">
                      <button type="submit" class="bg-slate-900 hover:bg-indigo-600 text-white px-4 py-2 rounded text-xs font-semibold transition">
                        <i class="fa-solid fa-cloud-arrow-up mr-1"></i> ${sub ? 'Actualizează Tema' : 'Trimite Tema'}
                      </button>
                    </form>
                  </div>
                `;
              }).join('')}
            </div>
          `;
        } else {
          // PROFESOR / ADMIN VIEW
          return `
            <div class="flex justify-between items-center mb-4">
              <div>
                <h2 class="text-xl font-bold text-slate-800">Corectare Teme & Notare Cursanți</h2>
                <p class="text-xs text-slate-500">Selectați modulul de curs pentru a vedea temele încărcate de cei 29 de cursanți.</p>
              </div>
            </div>

            <!-- Selectare Curs de corectat -->
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm mb-6 flex items-center gap-4">
              <label class="text-xs font-bold text-slate-700 uppercase">Selectează Cursul:</label>
              <select onchange="selectedCourseFilter = parseInt(this.value); render();" class="border rounded-lg p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none flex-1 max-w-md">
                ${db.courses.map(c => `
                  <option value="${c.id}" ${selectedCourseFilter === c.id ? 'selected' : ''}>${c.day}: ${c.title} (${c.lecturer})</option>
                `).join('')}
              </select>
            </div>

            <!-- Lista Teme Predate pentru Cursul Selectat -->
            <div class="space-y-4">
              ${(() => {
                const courseSubs = db.submissions.filter(s => s.courseId === selectedCourseFilter);
                if (courseSubs.length === 0) {
                  return `
                    <div class="bg-white p-8 rounded-xl border text-center text-slate-500">
                      <i class="fa-solid fa-inbox text-3xl mb-2 text-slate-300"></i>
                      <p>Niciun cursant nu a încărcat încă tema pentru acest modul.</p>
                    </div>
                  `;
                }

                return courseSubs.map(sub => `
                  <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                    <div class="flex justify-between items-start mb-2">
                      <div>
                        <h3 class="font-bold text-slate-800 text-base">${sub.userName}</h3>
                        <p class="text-xs text-slate-500">${sub.userEmail} • Predat la: ${sub.submittedAt}</p>
                      </div>
                      <a href="${sub.fileData}" download="${sub.fileName}" class="bg-indigo-50 text-indigo-700 hover:bg-indigo-100 border border-indigo-200 px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5 transition">
                        <i class="fa-solid fa-download"></i> Descarcă Fișier: ${sub.fileName}
                      </a>
                    </div>

                    ${sub.notes ? `<p class="text-xs text-slate-600 bg-slate-50 p-2 rounded mb-3 italic">Observații student: "${sub.notes}"</p>` : ''}

                    <!-- Formular Notare -->
                    <form onsubmit="event.preventDefault(); saveGradeAndFeedback(${sub.id}, this.grade.value, this.feedback.value);" class="bg-slate-50 p-3 rounded-lg border border-slate-200 text-xs space-y-3">
                      <div class="grid grid-cols-1 sm:grid-cols-4 gap-3">
                        <div>
                          <label class="block font-bold text-slate-700 mb-1">Notă (ex: 10, 9.5):</label>
                          <input name="grade" type="text" value="${sub.grade || ''}" required placeholder="ex: 10" class="w-full border rounded p-2 text-sm focus:ring-1 focus:ring-indigo-500 outline-none">
                        </div>
                        <div class="sm:col-span-3">
                          <label class="block font-bold text-slate-700 mb-1">Feedback Lector / Observații:</label>
                          <input name="feedback" type="text" value="${sub.feedback || ''}" placeholder="Scrie feedback-ul pentru cursant..." class="w-full border rounded p-2 text-sm focus:ring-1 focus:ring-indigo-500 outline-none">
                        </div>
                      </div>
                      <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded font-semibold text-xs transition">
                        <i class="fa-solid fa-floppy-disk mr-1"></i> Salvează Nota & Feedback
                      </button>
                    </form>
                  </div>
                `).join('');
              })()}
            </div>
          `;
        }
      }

      // TAB 3: Q&A
      if (activeTab === 'qa') {
        return `
          <h2 class="text-xl font-bold mb-4 text-slate-800">Întrebări și Discuții</h2>
          <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm mb-6">
            <h3 class="font-semibold text-sm mb-3">Adresează o întrebare lectorilor</h3>
            <form onsubmit="event.preventDefault(); addQuestion(this.title.value, this.text.value); this.reset();">
              <input name="title" required placeholder="Titlu întrebare / Subiect..." class="w-full border rounded-lg p-2.5 text-sm mb-2 focus:ring-2 focus:ring-indigo-500 outline-none">
              <textarea name="text" required placeholder="Detaliază întrebarea ta..." class="w-full border rounded-lg p-2.5 text-sm mb-3 focus:ring-2 focus:ring-indigo-500 outline-none" rows="2"></textarea>
              <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-xs font-medium hover:bg-indigo-700 transition">
                Postează Întrebarea
              </button>
            </form>
          </div>
          <div class="space-y-4">
            ${db.questions.map(q => `
              <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                <div class="flex items-center gap-2 mb-1">
                  <span class="font-bold text-slate-800 text-sm">${q.title}</span>
                  <span class="text-xs text-slate-400">• de ${q.author}</span>
                </div>
                <p class="text-slate-600 text-sm mb-3">${q.text}</p>
                <div class="pl-4 border-l-2 border-indigo-200 space-y-2">
                  ${q.replies.map(r => `<div class="bg-slate-50 p-2.5 rounded text-xs text-slate-700">${r}</div>`).join('')}
                </div>
              </div>
            `).join('')}
          </div>
        `;
      }

      // TAB 4: CATALOG NOTE GENERAL (ADMIN ONLY)
      if (activeTab === 'gradebook' && currentUser.role === 'admin') {
        const students = db.users.filter(u => u.role === 'student');
        return `
          <h2 class="text-xl font-bold mb-1 text-slate-800">Catalog General Note Cursanți</h2>
          <p class="text-xs text-slate-500 mb-6">Centralizatorul tuturor celor 29 de cursanți și notele obținute la cele 9 module de curs.</p>

          <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
              <table class="w-full text-xs text-left border-collapse">
                <thead class="bg-slate-900 text-white font-semibold">
                  <tr>
                    <th class="p-3 border-r border-slate-700">#</th>
                    <th class="p-3 border-r border-slate-700 min-w-[180px]">Cursant</th>
                    ${db.courses.map(c => `<th class="p-2 border-r border-slate-700 text-center min-w-[70px]">${c.day}</th>`).join('')}
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  ${students.map((st, i) => `
                    <tr class="hover:bg-slate-50">
                      <td class="p-3 font-mono text-slate-400 border-r">${i+1}</td>
                      <td class="p-3 font-bold text-slate-800 border-r">${st.name}</td>
                      ${db.courses.map(c => {
                        const sub = db.submissions.find(s => s.courseId === c.id && s.userId === st.id);
                        return `
                          <td class="p-2 text-center border-r font-mono">
                            ${sub && sub.grade ? `<span class="bg-green-100 text-green-800 font-bold px-1.5 py-0.5 rounded">${sub.grade}</span>` : (sub ? `<span class="text-amber-600 font-bold">P</span>` : `<span class="text-slate-300">-</span>`)}
                          </td>
                        `;
                      }).join('')}
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }
    }

    function addQuestion(title, text) {
      db.questions.unshift({
        id: Date.now(),
        author: currentUser.name,
        title: title,
        text: text,
        replies: []
      });
      saveData();
    }

    render();
  </script>
</body>
</html>
